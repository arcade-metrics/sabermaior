name: Erro em obra ou citação
description: Metadado errado, sumário quebrado, citação que não confere, obra duplicada ou faltando
title: "[obra] "
labels: ["acervo"]
body:
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de erro
      options:
        - Título, autor, médium ou autor espiritual errado
        - Sumário, capítulo ou página errados
        - Citação não confere com a resposta
        - Obra duplicada
        - Obra faltando
        - Outro
    validations:
      required: true
  - type: input
    id: obra
    attributes:
      label: Obra
      placeholder: Luz no Lar
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: O que está errado e o que deveria estar
      description: Se for uma resposta, cole a pergunta feita e o número da citação.
    validations:
      required: true
